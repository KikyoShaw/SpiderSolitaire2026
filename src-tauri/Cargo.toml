[package]
name = "spider-solitaire"
version = "1.0.0"
description = "Spider Solitaire built with Tauri 2 and Vue 3"
authors = ["KikyoShaw"]
edition = "2021"

[lib]
name = "spider_solitaire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
